<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Philippines 2027 Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: three-pane planner (steps | workspace | booking summary); collapses to one column with a sticky action bar on phones */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#e9efed; --line:#d5dfdc;
  --ink:#13211f; --ink-2:#4d605c; --ink-3:#7d8f8b;
  --accent:#0b6e6a; --accent-ink:#ffffff; --accent-soft:#d6ecea;
  --iao:#c8611e; --eni:#0f8fa3; --ceb:#3d6fb6;
  --iao-soft:#f8e6d8; --eni-soft:#d7eff3; --ceb-soft:#dde7f5; --mnl:#8a4fd6; --same:#b26a00; --same-soft:#fbeccf;
  --ok:#2e7d4f; --warn:#a15c00;
  --shadow:0 1px 2px rgba(19,33,31,.06),0 6px 18px rgba(19,33,31,.06);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#152220; --surface-2:#1c2c29; --line:#2a3d39;
  --ink:#e6efed; --ink-2:#a7bab6; --ink-3:#748985;
  --accent:#4fc1b8; --accent-ink:#06201e; --accent-soft:#173a37;
  --iao:#f0a067; --eni:#5ccbdc; --ceb:#8db2ea;
  --iao-soft:#3a2516; --eni-soft:#123238; --ceb-soft:#1b2a42; --mnl:#b98cf0; --same:#f2b84b; --same-soft:#3b2c10;
  --ok:#6fcf97; --warn:#e8b45a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#152220; --surface-2:#1c2c29; --line:#2a3d39;
  --ink:#e6efed; --ink-2:#a7bab6; --ink-3:#748985;
  --accent:#4fc1b8; --accent-ink:#06201e; --accent-soft:#173a37;
  --iao:#f0a067; --eni:#5ccbdc; --ceb:#8db2ea;
  --iao-soft:#3a2516; --eni-soft:#123238; --ceb-soft:#1b2a42; --mnl:#b98cf0; --same:#f2b84b; --same-soft:#3b2c10;
  --ok:#6fcf97; --warn:#e8b45a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:16px}

/* Header + progress */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font:700 clamp(22px,3.2vw,30px)/1.1 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.dates{color:var(--ink-2);font-size:13px;margin-top:4px}
.save{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.save[data-s="saved"] i{background:var(--ok)}.save[data-s="saving"] i{background:var(--warn)}.save[data-s="local"] i{background:var(--warn)}
.progress{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.bar span{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);transition:background .25s}
.bar span.done{background:var(--accent);border-color:var(--accent)}
.bar span.cur{box-shadow:0 0 0 2px var(--accent) inset}
.plabel{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}

/* Three panes */
.layout{display:grid;gap:16px;grid-template-columns:220px minmax(0,1fr) 300px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}

/* Step nav */
.steps{padding:10px;position:sticky;top:12px}
.stop{padding:6px 4px 10px}
.stop + .stop{border-top:1px solid var(--line)}
.stop h2{font:700 15px/1.2 var(--f-display);margin:8px 8px 6px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.step{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink-2)}
.step:hover{background:var(--surface-2);color:var(--ink)}
.step[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:12px;line-height:1}
.step.done .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.chips{display:none}

/* Workspace */
.work{padding:18px 18px 20px;display:grid;gap:14px}
.work-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.work h3{font:700 22px/1.15 var(--f-display);margin:2px 0 0;text-wrap:balance}
.route{font-size:13px;color:var(--ink-2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab b{font-weight:600}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ctl{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);gap:8px}
.ctl output{font:600 13px var(--f-mono);color:var(--ink)}
.ctl input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
.ctl select{width:100%;margin-top:6px;font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2)}
.list{display:grid;gap:8px}
.fbody{display:grid;gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:8px;border-radius:3px;display:inline-block}
.opt .radio{grid-column:1;grid-row:1}
.opt .total{grid-column:3;grid-row:1}
.segbar{grid-column:2 / -1;grid-row:2;display:grid;gap:4px;margin-top:4px;min-width:0}
.seg-track{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.seg{height:100%;flex:none}
.seg + .seg{box-shadow:inset 2px 0 0 var(--surface)}
.fly{background:var(--accent)}
.lay{background:repeating-linear-gradient(135deg,var(--accent) 0 2px,var(--accent-soft) 2px 6px)}
.wait{background:var(--mnl)}
.seg-txt{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl{grid-column:1 / -1;padding-bottom:6px}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--ink-2)}
.tl-head b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.tl-track{position:relative;height:62px;margin:4px 14px 0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.tl-rail{position:absolute;left:0;right:0;top:38px;height:14px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}
.tl-band{position:absolute;top:38px;height:14px;border-radius:7px;background:var(--accent-soft);border:1.5px solid var(--accent);cursor:grab}
.tl-band.drag,.tl-h.drag{cursor:grabbing}
.tl-track.view{cursor:default;height:44px}.tl-track.view .tl-rail{top:20px}.tl-track.view .tl-dot{top:24px}
.tl-dot{position:absolute;top:42px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ink-3);opacity:.4;pointer-events:none}
.tl-dot.in{background:var(--accent);opacity:1}
.tl-h{position:absolute;top:8px;width:32px;height:32px;margin-left:-16px;padding:0;border:0;background:none;cursor:grab;touch-action:none;z-index:2}
.tl-h::before{content:"";position:absolute;left:50%;bottom:2px;width:18px;height:15px;margin-left:-9px;background:var(--accent);clip-path:polygon(0 0,100% 0,50% 100%)}
.tl-h:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.tl-lbl{position:absolute;bottom:20px;font:600 12px/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);pointer-events:none}
.tl-lbl{left:50%;transform:translateX(-50%)}.tl-lbl.edgeL{left:4px;transform:none}.tl-lbl.edgeR{left:auto;right:4px;transform:none}.tl-lbl.up{bottom:36px}
.tl-track{height:76px}.tl-rail,.tl-band{top:52px}.tl-dot{top:56px}.tl-h{top:22px}
.tl-ticks{position:relative;height:14px;margin:2px 14px 0;font:11px/1 var(--f-mono);color:var(--ink-3)}
.tl-ticks span{position:absolute;transform:translateX(-50%)}
@media (max-width:760px){.tl-h{width:40px;margin-left:-20px}.tl-track{margin-inline:18px}.tl-ticks{margin-inline:18px}.tl-ticks span:nth-child(even){display:none}}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 12px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink-3)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-3);margin-top:3px;display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--accent)}
.opt[aria-checked="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.times{font:600 17px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.times .arr{color:var(--ink-3);font-weight:500;margin:0 4px}
.legs{font-size:12.5px;color:var(--ink-2);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.legs .via{font-weight:600}
.total{text-align:right}
.total .mono{font-size:15px;font-weight:600;display:block}
.total small{display:block;font-size:11.5px;color:var(--ink-3)}
.hotel .price{display:block}
.hrow{display:grid;gap:4px}
.maplink{justify-self:end;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:2px;padding:0 4px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.opt.same{border-left:4px solid var(--same);padding-left:9px}
.pill.same{background:var(--same-soft);color:var(--same);margin-left:6px;vertical-align:2px}
.pill.best{background:var(--accent);color:var(--accent-ink)}
.more{justify-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:13px}
.empty{padding:22px;text-align:center;color:var(--ink-2);background:var(--surface-2);border-radius:10px;font-size:14px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.note b{color:var(--ink)}
.hotel .name{display:block;font:600 16px/1.25 var(--f-body)}
.hotel .area{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.hotel .price{font:600 15px var(--f-mono)}
.nav{display:flex;justify-content:space-between;gap:10px;padding-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Summary */
.sum{padding:14px;display:grid;gap:12px;position:sticky;top:12px}
.sum-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sum-head h2{font:700 17px var(--f-display);margin:0}
.copy{font-size:12px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 9px;cursor:pointer}
.sum .cards{display:grid;gap:10px}
.lockbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:12px 16px;font-size:14px}
.lockbar b{font-weight:700}
body.locked .opt{cursor:default}
body.locked .opt:hover{border-color:var(--line)}
body.locked .opt[aria-checked="false"]{opacity:.5}
body.locked .tl-track{pointer-events:none;opacity:.55}
.submit{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.submit h3{font:700 15px var(--f-display);margin:0}
.submit label{display:grid;gap:3px;font-size:12px;color:var(--ink-2)}
.submit input{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.submit .btn{width:100%;text-align:center;text-decoration:none;display:block}
.submit .hint{font-size:12px;color:var(--ink-3);min-height:1.2em}
.submit .hint.ok{color:var(--ok);font-weight:600}
.submit .hint.err{color:var(--warn);font-weight:600}
.card{border-radius:10px;padding:10px 12px;border-left:4px solid var(--c);background:var(--soft)}
.card h3{font:700 15px var(--f-display);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.row{display:grid;gap:2px;padding:6px 0}
.row + .row{border-top:1px dashed var(--line)}
.row .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.row .val{font-size:13px}
.row .val .mono{font-size:12.5px}
.row .todo{font-size:13px;color:var(--ink-3)}
.row .edit{justify-self:start;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:0;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
details.sum-m{display:none}

/* Mobile action bar */
.actionbar{display:none}

@media (max-width:1080px){
  .layout{grid-template-columns:200px minmax(0,1fr)}
  .sumwrap{grid-column:1 / -1}
  .sum{position:static}
  .sum .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
}
@media (max-width:760px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .layout{grid-template-columns:minmax(0,1fr)}
  .steps{display:none}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .chip .tick{width:16px;height:16px;font-size:10px}
  .chip.done .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .work{padding:14px}
  .work .nav{display:none}
  .opt{padding:11px;gap:4px 10px}
  .times{font-size:16px}
  .actionbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:10px;align-items:center;background:var(--surface);border-top:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .actionbar .btn{flex:1}
  .actionbar .btn.back{flex:0 0 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="lockbar" id="lockbar" role="status" hidden></div>
  <div class="top">
    <div>
      <h1>Philippines 2027</h1>
      <div class="dates">Siargao, El Nido and Cebu · Jun 5–18, 2027</div>
    </div>
    <span class="save" id="save" data-s="loading"><i></i><span id="saveTxt">Loading saved plan…</span></span>
  </div>

  <div class="progress" aria-label="Trip progress">
    <div class="bar" id="bar"></div>
    <div class="plabel"><span id="pnow"></span><span id="pcount"></span></div>
  </div>

  <div class="chips" id="chips" role="tablist" aria-label="Steps"></div>

  <div class="layout">
    <nav class="pane steps" id="steps" aria-label="Steps"></nav>
    <main class="pane work" id="work" aria-live="polite"></main>
    <div class="sumwrap"><aside class="pane sum" id="sum" aria-label="Booking summary"></aside></div>
  </div>
</div>

<div class="actionbar" id="actionbar">
  <button class="btn back" id="mBack" type="button">Back</button>
  <button class="btn primary" id="mNext" type="button">Continue</button>

function stepSub(s){
  const p=plan[s.id];
  if(!p) return s.kind==='flight'?'Pick a flight':'Pick a hotel';
  if(s.kind==='flight'){const o=toObj(p.row);return short(p.date)+' · '+o.dep+'→'+o.arr;}
  const h=HOTELS[s.id].find(x=>x.id===p.id);return h?h.name:'Chosen';
}

function flightRows(s){
  const days=Object.keys(DATA[s.id]);

  const key={door:x=>x.wait+x.o.total,total:x=>x.o.total,dep:x=>toMin(x.o.dep),arr:x=>toMin(x.o.arr)}[sort];
  rows.sort((a,b)=>key(a)-key(b)||toMin(a.o.dep)-toMin(b.o.dep));
  return {days,day,rows,sort};
}

function segBar(o,wait,maxT){

/* ---------- Manila timeline (one control: arrival + latest departure) ---------- */
const endM=()=>Math.min(1439,ui.arr+ui.wait);
const snap=m=>Math.round(m/5)*5;
const pct=m=>(m/1440*100)+'%';
function updateTl(){
  const tr=document.getElementById('tlTrack'); if(!tr)return;
  const st=STEPS[cur];
  if(!st.sliders){ // view only: dots show when flights leave across the day
    tr.querySelectorAll('.tl-dot').forEach(d=>d.classList.add('in'));
    const rows=DATA[st.id][ui.day[st.id]]||[], times=new Set(rows.map(r=>r[0]));
    $('#tlRead').innerHTML=`<b>${times.size}</b> departure time${times.size===1?'':'s'} · <b>${rows.length}</b> ${st.direct?'flight':'connection'}${rows.length===1?'':'s'}`;
    return;
  }
  const a=ui.arr,b=endM();
  const A=$('#tlA'),B=$('#tlB'),band=$('#tlBand');
  A.style.left=pct(a);B.style.left=pct(b);band.style.left=pct(a);band.style.width=((b-a)/1440*100)+'%';
  A.setAttribute('aria-valuenow',a);A.setAttribute('aria-valuetext','Land '+hm(a));
  B.setAttribute('aria-valuenow',b);B.setAttribute('aria-valuetext','Leave by '+hm(b));
  const AL=$('#tlAL'),BL=$('#tlBL');
  AL.textContent='Land '+hm(a);BL.textContent='Leave by '+hm(b);
  // labels sit centred over their handle; pinned inward at the ends; the second one lifts when they would collide
  const w=tr.clientWidth||600, gap=(b-a)/1440*w;
  AL.className='tl-lbl'+(a/1440*w<50?' edgeL':'');
  BL.className='tl-lbl'+((1440-b)/1440*w<70?' edgeR':'')+(gap<150?' up':'');
  tr.querySelectorAll('.tl-dot').forEach(d=>{const t=+d.dataset.t;d.classList.toggle('in',t>=a&&t<=b);});
  const n=(DATA.f1[ui.day.f1]||[]).filter(r=>{const t=toMin(r[0]);return t>=a&&t<=b;}).length;
  $('#tlRead').innerHTML=`Wait up to <b>${dur(b-a)}</b> · <b>${n}</b> connection${n===1?'':'s'}`;
}
function setWin(arr,end){
  arr=Math.max(0,Math.min(1435,arr)); end=Math.max(arr,Math.min(1439,end));
  if(arr===ui.arr&&end===endM())return;
  ui.arr=arr; ui.wait=end>=1439&&arr===0?1439:end-arr;
  updateTl(); refreshList();
}
// Moving the arrival keeps the chosen wait length; "Leave by" only displays clamped at 23:59
function setArr(arr){
  arr=Math.max(0,Math.min(1435,arr));
  if(arr===ui.arr)return;
  ui.arr=arr; updateTl(); refreshList();
}
function setBy(m){
  const id=STEPS[cur].id; m=Math.max(0,Math.min(1439,m));
  if(m===ui.by[id])return;
  ui.by[id]=m; updateTl(); refreshList();
}
let drag=null;
document.addEventListener('pointerdown',e=>{
  if(locked)return;
  const tr=e.target.closest('#tlTrack'); if(!tr)return;
  const r=tr.getBoundingClientRect(), m=snap((e.clientX-r.left)/r.width*1440);
  if(!STEPS[cur].sliders) return; // view-only timeline
  let mode=e.target.closest('.tl-h')?e.target.closest('.tl-h').id:(e.target.closest('#tlBand')?'band':null);
  if(!mode){ // tap on the rail: move the nearer handle there
    mode=Math.abs(m-ui.arr)<=Math.abs(m-endM())?'tlA':'tlB';
    if(mode==='tlA')setArr(m); else setWin(ui.arr,m);
  }
  // handles stacked on top of each other: let the first drag direction pick (left = Land, right = Leave by)
  const handlePx=(endM()-ui.arr)/1440*r.width;
  if((mode==='tlA'||mode==='tlB')&&handlePx<24) mode='pending';
  drag={mode,r,start:m,off:m-ui.arr,width:endM()-ui.arr,id:e.pointerId,el:mode==='band'?$('#tlBand'):(mode==='pending'?$('#tlB'):$('#'+mode))};
  drag.el.classList.add('drag');
  try{tr.setPointerCapture(e.pointerId);}catch(_){}
  if(mode==='tlA'||mode==='tlB')drag.el.focus({preventScroll:true});
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const m=snap((e.clientX-drag.r.left)/drag.r.width*1440);
  if(drag.mode==='by') return setBy(Math.min(1439,m));
  if(drag.mode==='pending'){
    if(Math.abs(m-drag.start)<5)return;
    drag.el.classList.remove('drag');
    drag.mode=m<drag.start?'tlA':'tlB'; drag.el=$('#'+drag.mode); drag.el.classList.add('drag'); drag.el.focus({preventScroll:true});
  }
  if(drag.mode==='tlA') setArr(m);
  else if(drag.mode==='tlB') setWin(ui.arr,m);
  else {const a=Math.max(0,Math.min(1439-drag.width,m-drag.off)); setWin(a,a+drag.width);}
});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;drag.el.classList.remove('drag');drag=null;};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{
  if(locked)return;
  const h=e.target.closest&&e.target.closest('.tl-h'); if(!h)return;
  const step=e.shiftKey?60:5, k=e.key;
  let d=0; if(k==='ArrowRight'||k==='ArrowUp')d=step; else if(k==='ArrowLeft'||k==='ArrowDown')d=-step;
  else if(k==='Home')d=-1440; else if(k==='End')d=1440; else return;
  e.preventDefault();
  if(!STEPS[cur].sliders) setBy(ui.by[STEPS[cur].id]+d);
  else if(h.id==='tlA') setArr(ui.arr+d); else setWin(ui.arr,endM()+d);
});

  if(locked) lb.innerHTML=`<b>Plan submitted ${locked.at}.</b><span>To plan again, open this page in a new tab.</span>`;
  renderNav();renderWork();renderSum();}
function go(i){if(i>5){document.getElementById('sum').scrollIntoView({behavior:'smooth',block:'start'});return;}
  cur=Math.max(0,Math.min(5,i));remember();render();
  if(window.matchMedia('(max-width:760px)').matches) window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- events (delegated) ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.go!==undefined) return go(+t.dataset.go);
  if(t.dataset.step) return go(cur+ +t.dataset.step);
  if(t.id==='mBack') return go(cur-1);
  if(t.id==='mNext') return go(cur+1);
  if(t.dataset.day){ui.day[STEPS[cur].id]=t.dataset.day;return renderWork();}
  if(t.dataset.more){ui.shown[t.dataset.more]=(ui.shown[t.dataset.more]||20)+20;return renderWork();}
  if(t.dataset.pick){const s=STEPS[cur],[d]=t.dataset.pick.split('|');const row=DATA[s.id][d].find(r=>rowKey(d,r)===t.dataset.pick);
    return choose(s.id,{date:d,row});}
  if(t.dataset.hotel){return choose(STEPS[cur].id,{id:t.dataset.hotel});}
  if(t.id==='subLink'&&!locked){setTimeout(lockTab,0);return;}
  if(t.id==='copyBtn'){const txt=summaryText();
    const ok=()=>{t.textContent='Copied';setTimeout(()=>t.textContent='Copy',1500);};
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(ok).catch(()=>{
      const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');ok();}catch(_){t.textContent='Select and copy';}ta.remove();});}
});
document.addEventListener('input',e=>{
});
document.addEventListener('input',e=>{
  if(e.target.id==='subName'||e.target.id==='subEmail'){sub.name=$('#subName').value;sub.email=$('#subEmail').value;keepSub();updateSubmit();}
});
document.addEventListener('submit',e=>{if(e.target.id==='submitBox'){e.preventDefault();if(!$('#subBtn').disabled&&!IN_CLAUDE)submitPlan();}});
document.addEventListener('change',e=>{if(e.target.id==='sortS'){ui.sort[STEPS[cur].id]=e.target.value;renderWork();}});
let rq=0;function refreshList(){cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>{
  const b=document.getElementById('fbody'), s=STEPS[cur];
  if(b&&s.kind==='flight') b.innerHTML=renderFlightBody(s); else renderWork();});}

render();

/* ---------- shared saving ---------- */
(async()=>{
  let db=null;
  try{ db=window.claude&&window.claude.use?await window.claude.use('db'):null; }catch(e){db=null;}
  if(!db){ // hosted elsewhere (or signed out): keep each visitor's picks in their own browser
    if(locked){setSave('saved','Submitted');return;}
    try{const p=JSON.parse(localStorage.getItem('ph27-plan')||'null');if(p&&typeof p==='object'){plan=p;render();}
      setSave('saved','Saved on this device');}catch(e){setSave('local','Not saved · this browser blocks storage');}
    return;}
  dbRef=db.doc('plans/main');
  canWrite=true;
  try{const u=window.claude.use?await window.claude.use('user'):null;
    if(u&&u.can){const w=await u.can('data.write');if(w===false)canWrite=false;}}catch(e){}
  setSave('saved',canWrite?'Saved · shared with everyone on this link':'View only');
  dbRef.onSnapshot(snap=>{
    if(locked)return;
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    const d=snap.exists?snap.data():{};const next={};
    ['f1','h1','f2','h2','f3','h3'].forEach(k=>{if(d&&d[k])next[k]=d[k];});
    if(JSON.stringify(next)!==JSON.stringify(plan)){plan=next;render();}
    if(!canWrite)setSave('local','View only · you can look but not change picks');
  },err=>{setSave('local','Saving unavailable right now');});
})();
</script>
</body></html>
